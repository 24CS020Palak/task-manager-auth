<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task Manager - Auth</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>Task Manager</h1>
    <div id="message" class="message hidden"></div>

    <!-- AUTH VIEW -->
    <section id="authView">
      <div class="tabs">
        <button id="tabLogin" class="active">Login</button>
        <button id="tabRegister">Register</button>
      </div>

      <form id="loginForm">
        <input type="email" id="loginEmail" placeholder="Email" required />
        <input type="password" id="loginPassword" placeholder="Password" required />
        <button type="submit">Login</button>
      </form>

      <form id="registerForm" class="hidden">
        <input type="text" id="regName" placeholder="Name (optional)" />
        <input type="email" id="regEmail" placeholder="Email" required />
        <input type="password" id="regPassword" placeholder="Password (min 6 chars)" required minlength="6" />
        <button type="submit">Register</button>
      </form>
    </section>

    <!-- TASKS VIEW -->
    <section id="taskView" class="hidden">
      <div class="topbar">
        <span id="userInfo"></span>
        <button id="logoutBtn" class="danger">Logout</button>
      </div>

      <form id="taskForm">
        <input type="text" id="taskTitle" placeholder="Task title" required />
        <input type="text" id="taskDesc" placeholder="Description (optional)" />
        <button type="submit">Add Task</button>
      </form>

      <ul id="taskList"></ul>
    </section>
  </div>
  <script src="app.js"></script>
</body>
</html>
